name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: .opencode/local/mcps/nina_planner
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Create venv and install
        run: |
          uv venv --python ${{ matrix.python-version }} "$VIRTUAL_ENV"
          uv pip install -e . --group dev
      - name: Lint
        run: |
          "$VIRTUAL_ENV/bin/ruff" check nina_planner tests
          "$VIRTUAL_ENV/bin/ruff" format --check nina_planner tests
      - name: Type check
        run: '"$VIRTUAL_ENV/bin/mypy" nina_planner'
      - name: Tests
        # Live tests (real NINA) are deselected by default via pyproject addopts.
        run: '"$VIRTUAL_ENV/bin/python" -m pytest -q'
