[project]
name = "nina-planner"
version = "0.1.0"
description = "MCP server for N.I.N.A. telescope control"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0,<2",
    "httpx>=0.27",
]
[project.scripts]
nina_planner = "nina_planner.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.mypy]
python_executable = "$VIRTUAL_ENV/bin/python"
warn_return_any = true
strict_equality = true
disallow_untyped_defs = true
no_implicit_optional = true

