[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nina-planner"
version = "0.1.0"
description = "MCP server for N.I.N.A. telescope control"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
nina_planner = "nina_planner.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nina_planner*"]

[tool.mypy]
python_executable = "$VIRTUAL_ENV/bin/python"
warn_return_any = true
strict_equality = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F = Basic errors, I = Auto-sorting imports, B = Common code bugs
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

