
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nina-planner"
version = "0.1.0"
description = "MCP server for N.I.N.A. telescope control"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "george" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "nina",
    "astrophotography",
    "telescope",
    "observatory",
    "imaging",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0,<2",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/roseengineering/nina_planner_mcp_server"
Repository = "https://github.com/roseengineering/nina_planner_mcp_server"
Issues = "https://github.com/roseengineering/nina_planner_mcp_server/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
nina_planner = "nina_planner.__main__:main"

[tool.uv]
# Install the dev group (pytest, ruff, mypy, pytest-cov) by default on `uv sync`.
default-groups = ["dev"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nina_planner*"]

[tool.mypy]
python_executable = "$VIRTUAL_ENV/bin/python"
warn_return_any = true
strict_equality = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# E/F = Basic errors, I = Auto-sorting imports, B = Common code bugs
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# server.py docstrings are intentionally long for clarity; suppress E501 there.
# sequence.py contains CLR type-name strings that cannot be broken.
"nina_planner/server.py" = ["E501"]
"nina_planner/sequence.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -m 'not live'"
markers = [
    "live: slow environment-specific integration tests (running NINA or WSL required)",
]

[tool.coverage]
source = ["nina_planner"]
show_missing = true
skip_empty = true
